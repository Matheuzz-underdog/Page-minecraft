<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="CSS/styles.css">
    <link rel="icon" href="assets/icons/magnifyingGlass.ico">
    <title>Mincecraft Profile-Server Finder</title>
</head>
<body>
    <header>
        <nav>
            <a id="link-steam" href="steam.html">Ir al Buscador de Steam</a>
            <a id="link-maincraft" href="maincraft.html">Ir al Buscador de Minecraft</a>
            <a id="link-index" href="index.html">ir al incio</a>
        </nav>

        <div class="boton_con">
            <button id="config">
            <img src="assets/images/settings_pause_menu_icon.png" alt="configuracion">
            </button>
        </div>
        <div id="titulo_con">
            <img src="assets/images/TITULO.png" alt="MINECRAFT" id="titulo">
            <h1>PROFILE-SERVER FINDER</h1>
        </div>
        <div class="boton_con">
            <h4>modo</h4>
            <button id="toggle">
            <img src="assets/images/switch.png" alt="">
            </button>
        </div>
    </header>
    <main>
        <form id="form-busqueda">
            <input type="text" id="input-busqueda" placeholder="Ingresa un usuario o servidor para buscar...">
            <button type="submit" id="boton_buscar">
                <img src="assets/images/lupa.png" alt="buscar">
            </button>
        </form>
        <div id="lista-resultados" class="lista-resultados"></div>
    </main>
    <footer>
        <button id="info">
            <img src="assets/images/info.png" alt="info">
        </button>
        <script type="module" src="JS/main.js"></script>
    </footer>
</body>
</html>
