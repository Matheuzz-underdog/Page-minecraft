<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/styles.css">
    <link rel="icon" href="assets/icons/magnifyingGlass.ico">
    <title>Minecraft Profile-Server Finder</title>
</head>
<body class="page-minecraft">

    <header class="navbar">
        <h1>Buscador Minecraft</h1>
        <nav class="nav-links">
            <a id="link-index" href="index.html" class="btn-nav btn-inicio">Inicio</a>
            <a id="link-steam" href="steam.html" class="btn-nav btn-steam">Buscador de Steam</a>
            <a id="link-minecraft" href="minecraft.html" class="btn-nav btn-minecraft">Buscador de Minecraft</a>
        </nav>
    </header>

    <div class="minecraft-header">
        <div id="titulo_con">
            <img src="assets/images/TITULO.png" alt="MINECRAFT" id="titulo">
            <h1 class="minecraft-title">PROFILE-SERVER FINDER</h1>
        </div>
    </div>

    <main class="minecraft-main">
        <form id="form-busqueda">
            <input type="text" id="input-busqueda" placeholder="Ingresa un usuario o servidor para buscar...">
            <button type="submit" id="boton_buscar">
                <img src="assets/images/lupa.png" alt="buscar">
            </button>
        </form>
        <div id="lista-resultados" class="lista-resultados"></div>
    </main>

    <footer>
        <button id="info">
            <img src="assets/images/info.png" alt="info">
        </button>
    </footer>

    <script type="module" src="JS/main.js"></script>
</body>
</html>
