<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Buscadores - Página Principal</title>
</head>
<body>

    <header>
        <h1>Buscadores</h1>
        <nav>
            <a id="link-steam" href="steam.html">Ir al Buscador de Steam</a>
            <a id="link-maincraft" href="maincraft.html">Ir al Buscador de Minecraft</a>
        </nav>
    </header>

    <main>
        <p id="mensajes-sistema"></p>

        <section id="seccion-mas-jugados">
            <h2>Top 10 Juegos Más Jugados</h2>
            <ul id="lista-mas-jugados"></ul>
        </section>

        <section id="seccion-mas-vendidos">
            <h2>Top 10 Más Vendidos en la Historia</h2>
            <ul id="lista-mas-vendidos"></ul>
        </section>

        <template id="template-juego-jugado">
            <li>
                <img class="ranking-img" src="" alt="Portada del juego" width="120">
                <strong class="ranking-nombre"></strong>
                (AppID: <span class="ranking-appid"></span>)
                <p class="ranking-dato"></p>
                <span class="ranking-precio"></span>
            </li>
        </template>

        <template id="template-juego-vendido">
            <li>
                <img class="ranking-img" src="" alt="Portada del juego" width="120">
                <strong class="ranking-nombre"></strong>
                (AppID: <span class="ranking-appid"></span>)
                <p class="ranking-dato"></p>
                <span class="ranking-precio"></span>
            </li>
        </template>
    </main>

    <footer></footer>

    <script type="module" src="./JS/main-index.js"></script>
</body>
</html>
