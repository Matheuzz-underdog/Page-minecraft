<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="CSS/styles.css">
    <link rel="icon" href="assets/icons/magnifyingGlass.ico">
    <title>Mincecraft Profile-Server Finder</title>
</head>
<body>
    <header>
        <button id="config">
            <img src="assets/images/settings_pause_menu_icon.png" alt="configuracion">
        </button>
        <div id="titulo_con">
            <img src="assets/images/TITULO.png" alt="MINECRAFT" id="titulo">
            <h1>PROFILE-SERVER FINDER</h1>
        </div>
        <button id="toggle">
            <img src="assets/images/toggle_off.png" alt="">
        </button>
    </header>
    <main>
        <form id="form-busqueda">
            <input type="text" id="input-busqueda" placeholder="Ingresa un usuario o servidor para buscar...">
            <button type="submit">
                <img src="assets/images/magnifying_glass.png" alt="buscar">
            </button>
        </form>
        <div id="lista-resultados" class="lista-resultados"></div>
    </main>
    <footer>
        <button>
            <img src="assets/images/how_to_play_button_pressed.png" alt="">
        </button>
        <script type="module" src="JS/main.js"></script>
    </footer>
</body>
</html>
